[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hromi-telegram-bot"
version = "0.1.0rc1"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hromi-telegram-bot = "hromi_telegram_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hromi_telegram_bot = []

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["E402"]
"**/scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
